<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Manual Prático do Eletricista Residencial</title>
  <meta name="description" content="Área do aluno do Manual Prático do Eletricista Residencial: projetos, diagramas, cálculos, listas de materiais e bônus.">
  <meta name="theme-color" content="#010E1E">

  <!-- TROCAR: ícone da aba / atalho do celular (coloque o arquivo na pasta e ajuste o caminho) -->

  <!-- <link rel="apple-touch-icon" href="icone.png"> -->

  <!-- Fontes (sem internet o app usa as fontes do sistema, sem quebrar nada) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
/* ==========================================================
   Manual Prático do Eletricista Residencial — Estilos
   Paleta extraída da página de vendas (fundo claro, azul de
   ação, azul-marinho dos mockups e detalhes em âmbar).
   Mobile-first: o layout base é o do celular; os @media
   no fim ampliam para tablet e computador.
   ========================================================== */

:root {
  /* Cores da marca */
  --bg: #F9FAFC;          /* fundo principal */
  --surface: #FFFFFF;     /* cards */
  --tint: #EFF6FF;        /* blocos azul-claro */
  --line: #DCE6F7;        /* bordas finas azuladas */
  --line-2: #C3D4F3;
  --blue: #1547E6;        /* azul dos botões */
  --blue-600: #0F38BF;
  --blue-dark: #1D398D;   /* títulos */
  --navy: #010E1E;        /* azul-marinho dos mockups */
  --navy-2: #0A1F47;
  --amber: #F5B400;       /* destaques amarelo/dourado */
  --amber-soft: #FFF5D6;
  --green: #00A73E;
  --red: #D92D20;
  --text: #0E1A33;
  --muted: #5A6A85;

  /* Forma */
  --r-xl: 24px;
  --r-lg: 18px;
  --r: 14px;
  --r-sm: 10px;
  --shadow: 0 1px 2px rgba(16, 40, 100, .05), 0 6px 18px rgba(16, 40, 100, .06);
  --shadow-up: 0 2px 6px rgba(16, 40, 100, .08), 0 16px 34px rgba(21, 71, 230, .16);

  /* Tipografia */
  --f-title: "Archivo", "Arial Black", "Segoe UI", system-ui, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  --topo-h: 62px;
  --barra-h: 68px;
  --ease: cubic-bezier(.2, .7, .2, 1);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.55 var(--f-body);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
img { max-width: 100%; display: block; }
h1, h2, h3 { margin: 0; }
[hidden] { display: none !important; }

.ic {
  width: 22px; height: 22px; flex: none;
  fill: none; stroke: currentColor; stroke-width: 1.9;
  stroke-linecap: round; stroke-linejoin: round;
}

/* ===================== TOPO ===================== */
.topo {
  position: sticky; top: 0; z-index: 40;
  background:
    linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px) 0 0 / 22px 22px,
    linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px) 0 0 / 22px 22px,
    linear-gradient(120deg, var(--navy) 0%, var(--navy-2) 100%);
  color: #fff;
  border-bottom: 1px solid rgba(255,255,255,.06);
  padding-top: env(safe-area-inset-top);
}
.topo-inner {
  max-width: 1120px; margin: 0 auto;
  height: var(--topo-h);
  display: flex; align-items: center; gap: 10px;
  padding: 0 16px;
}
.topo-voltar {
  width: 40px; height: 40px; border-radius: 12px;
  display: grid; place-items: center;
  background: rgba(255,255,255,.08);
  transition: background .2s, transform .15s;
}
.topo-voltar:hover { background: rgba(255,255,255,.16); }
.topo-voltar:active { transform: scale(.94); }

.marca { display: flex; align-items: center; gap: 10px; min-width: 0; }
.marca-logo {
  width: 38px; height: 38px; border-radius: 11px; flex: none;
  display: grid; place-items: center;
  background: linear-gradient(140deg, #FFCD3C, var(--amber));
  color: var(--navy);
  box-shadow: 0 0 0 3px rgba(245,180,0,.18), 0 6px 16px rgba(245,180,0,.25);
}
.marca-logo .ic { fill: var(--navy); stroke: var(--navy); width: 20px; height: 20px; }
.marca-img { height: 38px; width: auto; }
.marca-nome { display: flex; flex-direction: column; line-height: 1.1; min-width: 0; }
.marca-nome small {
  font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase;
  color: #9DB5E6; font-weight: 600;
}
.marca-nome strong {
  font-family: var(--f-title); font-weight: 900; font-size: 16px;
  text-transform: uppercase; letter-spacing: .01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.topo-nav { display: none; margin-left: auto; gap: 4px; }
.topo-nav a {
  padding: 9px 14px; border-radius: 10px;
  font-weight: 600; font-size: 14px; color: #C9D6F2;
  transition: background .2s, color .2s;
}
.topo-nav a:hover { background: rgba(255,255,255,.08); color: #fff; }
.topo-nav a.ativo { background: var(--blue); color: #fff; }

/* ===================== CONTEÚDO ===================== */
.conteudo {
  max-width: 1120px; margin: 0 auto;
  padding: 18px 16px calc(var(--barra-h) + 36px + env(safe-area-inset-bottom));
  outline: none;
}
.tela { animation: entrar .38s var(--ease); }
@keyframes entrar { from { opacity: 0; transform: translateY(12px); } }

/* ===================== BOTÕES ===================== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 50px; padding: 0 20px; border-radius: 12px;
  font-family: var(--f-title); font-weight: 800; font-size: 14px;
  letter-spacing: .02em; text-transform: uppercase;
  transition: transform .15s, box-shadow .2s, background .2s;
}
.btn .ic { width: 20px; height: 20px; }
.btn:active { transform: scale(.97); }
.btn-primary {
  background: var(--blue); color: #fff;
  box-shadow: 0 8px 20px rgba(21,71,230,.28);
}
.btn-primary:hover { background: var(--blue-600); box-shadow: 0 10px 26px rgba(21,71,230,.36); }
.btn-sec {
  background: var(--surface); color: var(--blue-dark);
  border: 1.5px solid var(--line-2);
}
.btn-sec:hover { border-color: var(--blue); color: var(--blue); }
.btn-bloco { width: 100%; }
.btn-fav.on { background: var(--amber-soft); border-color: #F1DB96; color: #8A5E00; }
.btn-fav.on .ic { fill: var(--amber); stroke: #C98A00; }

.icon-btn {
  width: 42px; height: 42px; border-radius: 12px; flex: none;
  display: grid; place-items: center;
  background: var(--tint); color: var(--blue);
  transition: transform .15s, background .2s, color .2s;
}
.icon-btn:hover { background: #DCE8FF; }
.icon-btn:active { transform: scale(.9); }
.icon-btn .ic { width: 20px; height: 20px; }
.icon-btn.dl { background: var(--blue); color: #fff; }
.icon-btn.dl:hover { background: var(--blue-600); }
.icon-btn.on { background: var(--amber-soft); color: #C98A00; }
.icon-btn.on .ic { fill: var(--amber); stroke: #C98A00; }
.icon-btn.lock { background: #F1F3F8; color: #8A97AE; cursor: default; }

/* ===================== HOME: HERO ===================== */
.hero {
  position: relative; overflow: hidden;
  border-radius: var(--r-xl);
  padding: 26px 22px 46px;
  color: #fff;
  background:
    radial-gradient(420px 260px at 100% 0%, rgba(21,71,230,.55), transparent 70%),
    radial-gradient(300px 200px at 0% 100%, rgba(245,180,0,.14), transparent 70%),
    linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px) 0 0 / 26px 26px,
    linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px) 0 0 / 26px 26px,
    linear-gradient(150deg, var(--navy-2), var(--navy));
  box-shadow: 0 20px 40px rgba(1,14,30,.22);
}
.hero::after { /* faixa de "obra" na base, como nas capas dos bônus */
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 7px;
  background: repeating-linear-gradient(-45deg, var(--amber) 0 12px, var(--navy) 12px 24px);
  opacity: .85;
}
.eyebrow {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--amber);
  background: rgba(245,180,0,.12); border: 1px solid rgba(245,180,0,.3);
  padding: 5px 10px; border-radius: 999px;
}
.eyebrow .ic { width: 14px; height: 14px; fill: var(--amber); stroke: var(--amber); }
.hero h1 {
  margin-top: 14px;
  font-family: var(--f-title); font-weight: 900;
  font-size: clamp(27px, 7.4vw, 44px); line-height: 1.02;
  text-transform: uppercase; letter-spacing: -.005em;
}
.hero h1 span { color: var(--amber); display: block; }
.hero p { margin: 14px 0 0; color: #C9D6F2; font-size: 15px; max-width: 520px; }
.chips {
  list-style: none; padding: 0; margin: 18px 0 0;
  display: flex; flex-wrap: wrap; gap: 8px;
}
.chips li {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12.5px; font-weight: 600;
  padding: 6px 11px; border-radius: 999px;
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12);
}
.chips .ic { width: 15px; height: 15px; color: var(--amber); stroke-width: 2.6; }
.hero-capa { display: none; }

/* Capa placeholder (livro) — usada no hero, nos bônus e nas telas de material */
.capa-ph {
  position: relative; overflow: hidden;
  display: flex; flex-direction: column; justify-content: space-between;
  aspect-ratio: 3 / 4; width: 100%;
  border-radius: 6px 14px 14px 6px;
  padding: 18px 16px 26px 22px;
  color: #fff;
  background:
    radial-gradient(240px 180px at 100% 0%, rgba(21,71,230,.6), transparent 70%),
    linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px) 0 0 / 18px 18px,
    linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px) 0 0 / 18px 18px,
    linear-gradient(160deg, #0D2556, var(--navy));
  box-shadow: inset 6px 0 0 rgba(0,0,0,.35), 0 18px 36px rgba(1,14,30,.28);
}
.capa-ph::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 10px;
  background: repeating-linear-gradient(-45deg, var(--amber) 0 10px, #111 10px 20px);
}
.capa-ph .capa-raio { width: 34px; height: 34px; fill: var(--amber); stroke: var(--amber); }
.capa-ph .capa-tit {
  font-family: var(--f-title); font-weight: 900; text-transform: uppercase;
  font-size: 22px; line-height: 1.02; overflow-wrap: anywhere; hyphens: auto;
}
.capa-ph .capa-sub {
  display: inline-block; margin-top: 8px;
  font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
  color: var(--amber);
}
.capa-ph .capa-tag {
  position: absolute; right: 12px; top: 14px;
  font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  background: rgba(255,255,255,.1); border: 1px dashed rgba(255,255,255,.35);
  padding: 4px 7px; border-radius: 6px; color: #C9D6F2;
}
.capa-img { width: 100%; border-radius: 6px 14px 14px 6px; box-shadow: 0 18px 36px rgba(1,14,30,.25); }

/* ===================== BUSCA ===================== */
.busca { position: relative; z-index: 2; }
.hero + .busca { margin: -26px 12px 0; }
.busca-campo {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 16px; padding: 0 14px;
  box-shadow: var(--shadow);
  transition: border-color .2s, box-shadow .2s;
}
.busca-campo:focus-within { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(21,71,230,.12), var(--shadow); }
.busca-campo .ic { color: var(--muted); }
.busca input {
  flex: 1; min-width: 0; height: 54px;
  border: 0; outline: 0; background: transparent;
  font: 500 16px var(--f-body); color: var(--text);
}
.busca input::placeholder { color: #8C9AB3; }
.resultados { margin-top: 18px; }
.resultados-info { font-size: 13px; color: var(--muted); margin: 0 0 10px 2px; }

/* ===================== TÍTULOS DE BLOCO ===================== */
.titulo-bloco {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  margin: 34px 0 14px;
}
.titulo-bloco h2 {
  font-family: var(--f-title); font-weight: 900; font-size: 18px;
  text-transform: uppercase; color: var(--blue-dark); letter-spacing: .01em;
}
.titulo-bloco h2::after { /* sublinhado azul → âmbar da página de vendas */
  content: ""; display: block; width: 44px; height: 3px; margin-top: 7px; border-radius: 3px;
  background: linear-gradient(90deg, var(--blue), var(--amber));
}
.titulo-bloco a { font-size: 13.5px; font-weight: 600; color: var(--blue); white-space: nowrap; }

/* ===================== COMECE POR AQUI ===================== */
.comece {
  display: flex; align-items: center; gap: 14px;
  margin-top: 22px; padding: 18px;
  border-radius: var(--r-lg);
  background: linear-gradient(120deg, #FFF8E1, var(--tint) 60%);
  border: 1.5px solid #F4DE9B;
  transition: transform .2s var(--ease), box-shadow .2s;
}
.comece:hover { transform: translateY(-2px); box-shadow: var(--shadow-up); }
.comece:active { transform: scale(.99); }
.comece-ic {
  width: 50px; height: 50px; border-radius: 14px; flex: none;
  display: grid; place-items: center;
  background: var(--amber); color: var(--navy);
}
.comece-ic .ic { fill: var(--navy); width: 22px; height: 22px; }
.comece strong {
  display: block; font-family: var(--f-title); font-weight: 900; font-size: 16px;
  text-transform: uppercase; color: var(--navy);
}
.comece small { display: block; color: var(--muted); font-size: 13.5px; margin-top: 2px; }
.comece > .ic { margin-left: auto; color: var(--blue-dark); }

/* ===================== CARDS DAS SEÇÕES ===================== */
.grid-secoes { display: grid; grid-template-columns: 1fr; gap: 12px; }
.card-secao {
  position: relative; overflow: hidden;
  display: flex; align-items: center; gap: 14px;
  padding: 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow);
  transition: transform .22s var(--ease), box-shadow .22s, border-color .22s;
}
.card-secao:hover { transform: translateY(-3px); box-shadow: var(--shadow-up); border-color: #A9C1F5; }
.card-secao:active { transform: scale(.985); }
.cs-capa { display: none; }
.cs-ic {
  width: 52px; height: 52px; border-radius: 15px; flex: none;
  display: grid; place-items: center;
  background: var(--tint); color: var(--blue);
  transition: background .2s, color .2s;
}
.card-secao:hover .cs-ic { background: var(--blue); color: #fff; }
.cs-ic .ic { width: 26px; height: 26px; }
.cs-corpo { flex: 1; min-width: 0; }
.cs-corpo strong {
  display: block; font-family: var(--f-title); font-weight: 800; font-size: 16px;
  color: var(--navy); line-height: 1.2;
}
.cs-corpo small { display: block; margin-top: 4px; color: var(--muted); font-size: 13.5px; line-height: 1.45; }
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  margin-top: 9px;
  font-size: 11.5px; font-weight: 700; letter-spacing: .03em;
  color: var(--blue-dark); background: var(--tint);
  padding: 4px 9px; border-radius: 999px;
}
.pill.ouro { background: var(--amber-soft); color: #8A5E00; }
.cs-seta { color: #9DB0D6; transition: transform .2s, color .2s; }
.card-secao:hover .cs-seta { transform: translateX(3px); color: var(--blue); }

/* ===================== LISTA DE MATERIAIS ===================== */
.lista { display: grid; gap: 10px; }
.item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 12px 12px 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  cursor: pointer;
  transition: border-color .2s, box-shadow .2s, transform .15s;
}
.item:hover { border-color: #A9C1F5; box-shadow: var(--shadow); }
.item:active { transform: scale(.99); }
.item:focus-visible { outline: 3px solid rgba(21,71,230,.35); outline-offset: 2px; }
.item-ic {
  width: 42px; height: 42px; border-radius: 12px; flex: none;
  display: grid; place-items: center;
  background: var(--tint); color: var(--blue-dark);
}
.item-ic .ic { width: 21px; height: 21px; }
.item-txt { flex: 1; min-width: 0; }
.item-txt strong { display: block; font-weight: 700; font-size: 14.5px; line-height: 1.3; color: var(--navy); }
.item-txt small {
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  color: var(--muted); font-size: 13px; margin-top: 2px;
}
.item-selo {
  display: inline-block; margin-bottom: 3px;
  font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--blue);
}
.item-acoes { display: flex; gap: 6px; }

/* ===================== CABEÇALHO DE SEÇÃO ===================== */
.cabecalho {
  display: flex; gap: 14px; align-items: flex-start;
  padding: 20px 18px;
  border-radius: var(--r-xl);
  background:
    radial-gradient(300px 160px at 100% 0%, rgba(21,71,230,.12), transparent 70%),
    var(--tint);
  border: 1px solid var(--line);
}
.cabecalho-ic {
  width: 54px; height: 54px; border-radius: 16px; flex: none;
  display: grid; place-items: center;
  background: var(--blue); color: #fff;
  box-shadow: 0 10px 22px rgba(21,71,230,.3);
}
.cabecalho-ic .ic { width: 27px; height: 27px; }
.cabecalho.ouro .cabecalho-ic { background: var(--amber); color: var(--navy); box-shadow: 0 10px 22px rgba(245,180,0,.3); }
.migalha { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.migalha a { color: var(--blue); }
.cabecalho h1 {
  margin-top: 2px;
  font-family: var(--f-title); font-weight: 900; font-size: 23px; line-height: 1.1;
  text-transform: uppercase; color: var(--blue-dark);
}
.cabecalho p { margin: 6px 0 0; color: var(--muted); font-size: 14.5px; }

/* ===================== ABAS (Projetos) ===================== */
.abas { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 16px; }
.aba {
  display: inline-flex; align-items: center; gap: 7px;
  height: 42px; padding: 0 15px; border-radius: 999px;
  font-weight: 600; font-size: 14px; color: var(--blue-dark);
  background: var(--surface); border: 1.5px solid var(--line);
  transition: background .2s, color .2s, border-color .2s, transform .15s;
}
.aba .ic { width: 18px; height: 18px; }
.aba:hover { border-color: var(--blue); }
.aba:active { transform: scale(.96); }
.aba.ativa { background: var(--navy); border-color: var(--navy); color: #fff; }
.aba-desc { color: var(--muted); font-size: 13.5px; margin: -6px 0 14px 2px; }

/* Cards de categoria (subcards dos projetos) */
.grid-cats { display: grid; grid-template-columns: 1fr; gap: 12px; }
.card-cat {
  display: flex; flex-direction: column; gap: 12px;
  padding: 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  cursor: pointer;
  transition: transform .22s var(--ease), box-shadow .22s, border-color .22s;
}
.card-cat:hover { transform: translateY(-3px); box-shadow: var(--shadow-up); border-color: #A9C1F5; }
.card-cat:active { transform: scale(.985); }
.card-cat-top { display: flex; gap: 12px; align-items: flex-start; }
.card-cat strong { display: block; font-family: var(--f-title); font-weight: 800; font-size: 15.5px; line-height: 1.25; color: var(--navy); }
.card-cat small { display: block; color: var(--muted); font-size: 13px; margin-top: 3px; }
.card-cat-pe {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding-top: 12px; border-top: 1px dashed var(--line);
}
.card-cat-pe span { font-size: 12.5px; font-weight: 600; color: var(--blue); display: inline-flex; align-items: center; gap: 4px; }
.card-cat-pe span .ic { width: 16px; height: 16px; }

/* ===================== BÔNUS ===================== */
.grid-bonus { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 18px; }
.card-bonus {
  display: grid; grid-template-columns: 112px 1fr; gap: 16px; align-items: start;
  padding: 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow);
  transition: transform .22s var(--ease), box-shadow .22s;
}
.card-bonus:hover { transform: translateY(-3px); box-shadow: var(--shadow-up); }
.card-bonus .capa-ph { padding: 10px 8px 16px 12px; cursor: pointer; }
.card-bonus .capa-ph .capa-tit { font-size: 12.5px; }

  get(k, padrao) {
    try { const v = localStorage.getItem("mper:" + k); return v ? JSON.parse(v) : padrao; }
    catch (e) { return padrao; }
  },
  set(k, v) { try { localStorage.setItem("mper:" + k, JSON.stringify(v)); } catch (e) { /* sem armazenamento */ } }
};

const icon = (nome, cls = "") =>

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

// Botão de download. O link vem do campo `link` em TEMAS (COLAR LINK REAL AQUI lá).
function botaoBaixar(m, compacto) {
  const attrs = m.link ? `href="${esc(m.link)}" download target="_blank" rel="noopener"` : `href="#"`;
  return compacto
    ? `<a class="icon-btn dl" ${attrs} data-arquivo="${m.id}" data-acao="baixar" aria-label="Baixar ${esc(m.titulo)}">${icon("baixar")}</a>`
    : `<a class="btn btn-primary" ${attrs} data-arquivo="${m.id}" data-acao="baixar">${icon("baixar")} Baixar arquivo</a>`;
}

function botaoAbrir(m) {
  const attrs = m.link ? `href="${esc(m.link)}" target="_blank" rel="noopener"` : `href="#"`;
  return `<a class="btn btn-sec" ${attrs} data-arquivo="${m.id}" data-acao="abrir">${icon("abrir")} Abrir material</a>`;
}

function botaoFavorito(m, compacto) {
  const on = favoritos.includes(m.id);
  return compacto
    ? `<button class="icon-btn ${on ? "on" : ""}" data-fav="${m.id}" aria-pressed="${on}" aria-label="Favoritar">${icon("estrela")}</button>`
    : `<button class="btn btn-sec btn-fav ${on ? "on" : ""}" data-fav="${m.id}" aria-pressed="${on}">${icon("estrela")} <span>${on ? "Salvo nos favoritos" : "Salvar nos favoritos"}</span></button>`;
}

/* ----------------------------------------------------------
   7. BUSCA
   ---------------------------------------------------------- */
function ligarBusca() {
  const input = $app.querySelector("[data-busca]");
  if (!input) return;
  const alvo = document.getElementById(input.dataset.busca);
  const box = document.getElementById("resultados");

  input.addEventListener("input", () => {
    const q = norm(input.value.trim());
    if (!q) { box.hidden = true; alvo.hidden = false; return; }
    const termos = q.split(/\s+/);
    const achados = TEMAS.filter(m => termos.every(t => norm(`${m.titulo} ${m.desc}`).includes(t)));
    alvo.hidden = true;
    box.hidden = false;
    box.innerHTML = achados.length
      ? `<p class="resultados-info">${achados.length} ${achados.length === 1 ? "material encontrado" : "materiais encontrados"}</p>
         <div class="lista duas">${achados.map(itemMaterial).join("")}</div>`
      : vazio("busca", "Nenhum material encontrado", "Tente outro termo.");
  });
}


/* ----------------------------------------------------------
   8. FAVORITOS, RECENTES, AVISOS
   ---------------------------------------------------------- */
function alternarFavorito(id) {
  const on = !favoritos.includes(id);
  favoritos = on ? [id, ...favoritos] : favoritos.filter(f => f !== id);
  store.set("favoritos", favoritos);
  toast(on ? "Salvo nos favoritos" : "Removido dos favoritos");

  if (rota().tela === "favoritos") { render(false); return; }
  document.querySelectorAll(`[data-fav="${id}"]`).forEach(b => {
    b.classList.toggle("on", on);
    b.setAttribute("aria-pressed", on);
    const span = b.querySelector("span");
    if (span) span.textContent = on ? "Salvo nos favoritos" : "Salvar nos favoritos";
  });
}

function registrarRecente(id) {
  recentes = [id, ...recentes.filter(r => r !== id)].slice(0, 6);
  store.set("recentes", recentes);
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("ver");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("ver"), 2600);
}

// Mensagem "Acesso liberado!" — só na primeira visita e só se CONFIG.acessoConfirmado = true
function mostrarBoasVindas() {
  if (!CONFIG.acessoConfirmado || store.get("boasVindasVista", false)) return;
  const modal = document.getElementById("modalAcesso");
  document.getElementById("modalKit").innerHTML = `${icon("raio")} ${esc(CONFIG.kit)}`;
  modal.hidden = false;
  const fechar = () => { modal.hidden = true; store.set("boasVindasVista", true); };
  document.getElementById("btnModal").onclick = fechar;
  modal.onclick = e => { if (e.target === modal) fechar(); };
}

   9. ROTEADOR
   ---------------------------------------------------------- */
function rota() {
  const partes = location.hash.replace(/^#\/?/, "").split("/");
  return { tela: partes[0] || "inicio", param: decodeURIComponent(partes.slice(1).join("/")) };
}

function render(animar = true) {
  const r = rota();
  const telas = {
    inicio: telaInicio,
    material: () => telaMaterial(r.param),
    acervo: telaAcervo,
    favoritos: telaFavoritos,
    mais: telaMais
  };
  $app.innerHTML = `<div class="${animar ? "tela" : ""}">${(telas[r.tela] || telaNaoEncontrada)()}</div>`;
  ligarBusca();

  const ativo = { inicio: "inicio", favoritos: "favoritos", mais: "mais" }[r.tela] || "acervo";
  document.querySelectorAll("[data-nav]").forEach(a => a.classList.toggle("ativo", a.dataset.nav === ativo));

  const voltar = document.getElementById("btnVoltar");
  voltar.hidden = r.tela === "inicio";
  voltar.onclick = () => { location.hash = "#/inicio"; };

  const nome = r.tela === "material" ? byId[r.param]?.titulo
    : { acervo: "Acervo", favoritos: "Favoritos", mais: "Mais" }[r.tela];
  document.title = nome ? `${nome} · Manual Prático do Eletricista Residencial` : "Manual Prático do Eletricista Residencial";

  if (animar) window.scrollTo(0, 0);
}


/* ----------------------------------------------------------
   10. EVENTOS
   ---------------------------------------------------------- */
document.addEventListener("click", e => {
  const fav = e.target.closest("[data-fav]");
  if (fav) { e.preventDefault(); e.stopPropagation(); alternarFavorito(fav.dataset.fav); return; }

  const acao = e.target.closest("[data-acao]");
  if (acao) {
    e.stopPropagation();
    const m = byId[acao.dataset.arquivo];
    if (!m || !m.link) { e.preventDefault(); toast("Este arquivo ainda não está disponível para download."); }
    return;
  }

  if (e.target.closest("[data-limpar]")) {
    recentes = [];
    store.set("recentes", recentes);
    toast("Histórico apagado");
    return;
  }

  const ir = e.target.closest("[data-ir]");
  if (ir && !e.target.closest("a, button")) location.hash = ir.dataset.ir;
});

document.addEventListener("keydown", e => {
  const ir = e.target.closest && e.target.closest("[data-ir]");
  if (ir && e.target === ir && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); location.hash = ir.dataset.ir; }
});

window.addEventListener("hashchange", () => render(true));

if (!location.hash) history.replaceState(null, "", "#/inicio");
render(true);
mostrarBoasVindas();

</script>
</body>
</html>
